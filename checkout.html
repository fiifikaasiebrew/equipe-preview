<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout | équipe clothes store</title>
<meta name="robots" content="noindex,nofollow"><link rel="icon" href="images/favicon.png"><link rel="stylesheet" href="css/site.css"><script src="js/app.js" defer></script></head>
<body data-page="checkout">
<div id="hdr"></div>
<main class="wrap">
  <h1 class="title" style="margin:34px 0 22px">Checkout</h1>
  <div id="coWrap">
  <form class="co" id="co" novalidate>
    <div class="card-box f">
      <h2>Your details</h2>
      <div class="row"><label>Full name<input class="field" name="name" autocomplete="name" required></label>
      <label>Phone (WhatsApp)<input class="field" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0556699940" required></label></div>
      <label>Email (optional, for your receipt)<input class="field" name="email" type="email" autocomplete="email"></label>
      <h2 style="margin-top:10px">Delivery</h2>
      <div class="opts">
        <label class="opt"><input type="radio" name="area" value="accra" checked><span><b>Delivery in Accra</b>To your door in Greater Accra.</span></label>
        <label class="opt"><input type="radio" name="area" value="other"><span><b>Delivery outside Accra</b>Sent by bus or courier, we confirm the details with you.</span></label>
        <label class="opt"><input type="radio" name="area" value="pickup"><span><b>Pickup in Accra</b>We message you the pickup point.</span></label>
      </div>
      <label id="addrRow">Delivery address and landmark<textarea class="field" name="address" rows="3" placeholder="House number, area, landmark"></textarea></label>
      <label>Notes (optional)<textarea class="field" name="notes" rows="2"></textarea></label>
    </div>
    <div class="card-box">
      <h2>Order summary</h2>
      <div id="sumLines"></div>
      <div class="sum" id="sumTot" style="margin:14px 0"></div>
      <p class="note err" id="err" hidden role="alert"></p>
      <button class="btn full" id="pay" type="submit">Pay now</button>
      <p class="secure" style="justify-content:center">🔒 Secure payment by Paystack: Mobile Money or card</p>
      <p class="center" style="margin:10px 0 0">or</p>
      <a class="btn wa full" id="waOrder" target="_blank" rel="noopener" style="margin-top:10px">Order on WhatsApp instead</a>
    </div>
  </form></div>
</main>
<div id="ftr"></div>
</body></html>
